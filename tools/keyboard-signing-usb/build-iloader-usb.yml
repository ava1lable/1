name: Build USB-only iloader signing experiment
on:
  workflow_dispatch:
  push:
    branches: ['codex/keyboard-usb-signer-r1']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nab138/iloader
          ref: dc396af059fd46982062cd8fc90252d7e27085e9
          path: iloader-source
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Apply USB-only patch to pinned source
        run: python tools/keyboard-signing-usb/patch.py iloader-source
      - name: Prepare Windows compilation dependencies
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          choco install strawberryperl make --no-progress -y
      - name: Install locked frontend dependencies
        working-directory: iloader-source
        run: bun install --frozen-lockfile
      - name: Compile portable USB validation executable
        working-directory: iloader-source
        run: bun run tauri build --no-bundle -- --locked
      - name: Preserve executable, source, license, and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath iloader-source/src-tauri/target/release/iloader.exe -Destination artifacts/iloader-usb-validation.exe
          Copy-Item -LiteralPath iloader-source/usb-patch-verification.json -Destination artifacts/usb-patch-verification.json
          Copy-Item -LiteralPath tools/keyboard-signing-usb/README.txt -Destination artifacts/README.txt
          Copy-Item -LiteralPath tools/keyboard-signing-usb/patch.py -Destination artifacts/patch.py
          Copy-Item -LiteralPath tools/keyboard-signing-usb/build-iloader-usb.yml -Destination artifacts/build-iloader-usb.yml
          python -c "from pathlib import Path; import zipfile; r=Path('iloader-source'); z=zipfile.ZipFile('artifacts/iloader-usb-validation-source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,'iloader-source/'+p.relative_to(r).as_posix()) for p in sorted(r.rglob('*')) if p.is_file() and not any(s in ('.git','node_modules','target') for s in p.relative_to(r).parts)]; z.close()"
          python -c "from pathlib import Path; import hashlib; r=Path('artifacts'); (r/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(r.iterdir()) if p.is_file()),encoding='utf-8')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iloader-usb-validation-r1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
