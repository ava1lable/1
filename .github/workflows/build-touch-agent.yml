name: Build JHH Touch Agent stage 1
on:
  workflow_dispatch:
  push:
    paths:
      - 'touch-agent/**'
      - '.github/workflows/build-touch-agent.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check packaging boundaries
        run: python3 -m unittest discover -s touch-agent/tests -v
      - name: Build unsigned iOS 16 touch agent
        run: python3 touch-agent/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JHH-Touch-Agent-stage1-unsigned
          path: touch-agent/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JHH-Touch-Agent-build-failure
          path: touch-agent/build/xcode-build.log
          if-no-files-found: ignore
          retention-days: 7
